name: Terraform Deploy to prod

on:
  workflow_run:
    workflows: ["Terraform Deploy to test"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency: deploy-terraform-${{ github.ref }}-${{ github.workflow }}-prod

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: prod
    defaults:
      run:
        working-directory: iac/terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~1.1

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure Terraform Cloud
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
        run: |
          cat > $HOME/.terraformrc << EOF
          credentials "app.terraform.io" {
            token = "$TFC_TOKEN"
          }
          EOF

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -no-color
        env:
          TF_VAR_environment: prod

      - name: Manual Approval Required
        run: |
          echo "🚨 PRODUCTION DEPLOYMENT 🚨"
          echo "This workflow requires manual approval via GitHub Environment protection rules"
          echo "Infrastructure will be deployed to production environment"

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve
        env:
          TF_VAR_environment: prod

      - name: Output Infrastructure Details
        run: terraform output -json > terraform-outputs-prod.json

      - name: Upload Terraform Outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-prod
          path: iac/terraform/terraform-outputs-prod.json

      - name: Run Production Validation
        run: |
          echo "Running production infrastructure validation..."
          # Add production validation commands here
          # Example: health checks, monitoring setup verification, etc.

      - name: Notify Deployment Success
        run: |
          echo "✅ Production deployment completed successfully"
          echo "Infrastructure outputs available in artifacts"