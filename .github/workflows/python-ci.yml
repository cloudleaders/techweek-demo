name: Python CI

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/python-ci.yml"

permissions:
  contents: read
  security-events: write

jobs:
  python-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 flake8-sarif
      
      - name: Run Flake8 (SARIF)
        run: |
          flake8 src/ --format sarif --output-file flake8-results.sarif
        continue-on-error: true
      
      - name: Upload Flake8 SARIF
        uses: actions/upload-artifact@v4
        with:
          name: flake8-sarif-${{ matrix.python-version }}
          path: flake8-results.sarif

  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml]
      
      - name: Run Bandit (SARIF)
        run: |
          bandit -r src/ -f sarif -o bandit-results.sarif || true
      
      - name: Upload Bandit SARIF
        uses: actions/upload-artifact@v4
        with:
          name: bandit-sarif
          path: bandit-results.sarif

  python-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      
      - name: Build Lambda deployment package
        run: |
          cd src/lambda-s3-lambda-trigger
          zip -r ../../lambda-s3-lambda-trigger.zip . -x "*.pyc" "__pycache__/*"
      
      - name: Upload Lambda package
        uses: actions/upload-artifact@v4
        with:
          name: lambda-deployment-package
          path: lambda-s3-lambda-trigger.zip
          retention-days: 30

  python-upload-sarif:
    runs-on: ubuntu-latest
    needs: [python-lint, python-security]
    if: always()
    steps:
      - uses: actions/checkout@v4
      
      - name: Download SARIF artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-sarif*"
          merge-multiple: true
      
      - name: Upload Flake8 SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        if: hashFiles('flake8-results.sarif') != ''
        with:
          sarif_file: flake8-results.sarif
          category: flake8
        continue-on-error: true
      
      - name: Upload Bandit SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        if: hashFiles('bandit-results.sarif') != ''
        with:
          sarif_file: bandit-results.sarif
          category: bandit
        continue-on-error: true