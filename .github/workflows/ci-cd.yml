name: CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:


jobs:
  python-lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        working-directory: src/lambda-python-s3-lambda-trigger
        run: |
          if [ -f requirements.txt ] && [ -s requirements.txt ]; then
            pip install -r requirements.txt
          fi
      - name: Run Flake8
        run: |
          pip install flake8
          flake8 . || true

  python-security:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        working-directory: src/lambda-python-s3-lambda-trigger
        run: |
          if [ -f requirements.txt ] && [ -s requirements.txt ]; then
            pip install -r requirements.txt
          fi
      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r . || true

  python-test:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        working-directory: src/lambda-python-s3-lambda-trigger
        run: |
          if [ -f requirements.txt ] && [ -s requirements.txt ]; then
            pip install -r requirements.txt
          fi
      - name: Install test dependencies
        if: ${{ hashFiles('tests/**') != '' }}
        run: |
          pip install pytest pytest-cov
      - name: Run tests
        if: ${{ hashFiles('tests/**') != '' }}
        run: |
          pytest tests/ --cov=. --cov-report=xml --cov-report=html || true
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 1

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~1.1
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Configure Terraform Cloud
        working-directory: iac/terraform
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
        run: |
          if [ -n "$TFC_TOKEN" ]; then
            cat > $HOME/.terraformrc << EOF
          credentials "app.terraform.io" {
            token = "$TFC_TOKEN"
          }
          EOF
          fi
      - name: Terraform Init
        working-directory: iac/terraform
        run: terraform init -backend=false
      - name: Terraform Validate
        working-directory: iac/terraform
        run: terraform validate
      - name: Terraform Format
        working-directory: iac/terraform
        run: terraform fmt

  terraform-security:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov
        run: |
          pip install checkov
          checkov -d . || true

  terraform-plan:
    runs-on: ubuntu-latest
    needs: [terraform-validate]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~1.1
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Configure Terraform Cloud
        working-directory: iac/terraform
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
        run: |
          if [ -n "$TFC_TOKEN" ]; then
            cat > $HOME/.terraformrc << EOF
          credentials "app.terraform.io" {
            token = "$TFC_TOKEN"
          }
          EOF
          fi
      - name: Terraform Init
        working-directory: iac/terraform
        run: terraform init
      - name: Detect Terraform Cloud backend
        id: detect-tfc
        working-directory: iac/terraform
        run: |
          if grep -q "cloud" backend.tf 2>/dev/null || [ -n "$TFC_TOKEN" ]; then
            echo "USE_TFC=true" >> $GITHUB_ENV
            echo "Terraform Cloud backend detected"
          else
            echo "USE_TFC=false" >> $GITHUB_ENV
            echo "Standard backend detected"
          fi
      - name: Terraform Plan
        working-directory: iac/terraform
        run: terraform plan
      - name: Upload plan artifact
        if: env.USE_TFC == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: iac/terraform/tfplan
          retention-days: 1

  terraform-deploy:
    name: Build Lambda and Deploy Terraform
    needs: [python-lint, python-security, python-test, terraform-security, terraform-validate]
    runs-on: ubuntu-latest
    environment: production
    if: always()
    steps:
      - uses: actions/checkout@v4
      
      # Python Build Steps
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Python dependencies (S3 Lambda)
        working-directory: src/lambda-python-s3-lambda-trigger
        run: |
          if [ -f requirements.txt ] && [ -s requirements.txt ]; then
            pip install -r requirements.txt
          fi
      - name: Install Python dependencies (DynamoDB SQS Lambda)
        working-directory: src/lambda-python-dynamodb-sqs-lambda
        run: |
          if [ -f requirements.txt ] && [ -s requirements.txt ]; then
            pip install -r requirements.txt
          fi
      - name: Build S3 Lambda package for Terraform
        run: |
          mkdir -p ./iac/terraform
          cd src/lambda-python-s3-lambda-trigger
          zip -r ../../iac/terraform/lambda_function.zip . -x "*.git*" "*.md" "tests/*" "*.tf*" "iac/**"
          cd ../..
          echo "✓ S3 Lambda package built at: ./iac/terraform/lambda_function.zip"
          ls -lh ./iac/terraform/lambda_function.zip
      - name: Build DynamoDB SQS Lambda packages for Terraform
        run: |
          mkdir -p ./iac/terraform
          # Build main Lambda package (lambda_handler.py)
          cd src/lambda-python-dynamodb-sqs-lambda
          zip -r ../../iac/terraform/lambda_function.zip lambda_handler.py requirements.txt -x "*.git*" "*.md" "tests/*" "*.tf*" "iac/**" "stream_handler.py"
          cd ../..
          echo "✓ DynamoDB SQS Lambda package built at: ./iac/terraform/lambda_function.zip"
          ls -lh ./iac/terraform/lambda_function.zip
          # Build stream Lambda package (stream_handler.py)
          cd src/lambda-python-dynamodb-sqs-lambda
          zip -r ../../iac/terraform/stream_lambda.zip stream_handler.py requirements.txt -x "*.git*" "*.md" "tests/*" "*.tf*" "iac/**" "lambda_handler.py"
          cd ../..
          echo "✓ Stream Lambda package built at: ./iac/terraform/stream_lambda.zip"
          ls -lh ./iac/terraform/stream_lambda.zip

      # Terraform Deploy Steps
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~1.1
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Configure Terraform Cloud
        working-directory: iac/terraform
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
        run: |
          if [ -n "$TFC_TOKEN" ]; then
            cat > $HOME/.terraformrc << EOF
          credentials "app.terraform.io" {
            token = "$TFC_TOKEN"
          }
          EOF
          fi
      - name: Verify Lambda packages exist
        run: |
          # Verify main Lambda package
          LAMBDA_PACKAGE="./iac/terraform/lambda_function.zip"
          if [ ! -f "$LAMBDA_PACKAGE" ]; then
            echo "Error: Lambda package not found at: $LAMBDA_PACKAGE"
            exit 1
          fi
          echo "✓ Lambda package verified at: $LAMBDA_PACKAGE"
          ls -lh "$LAMBDA_PACKAGE"
          # Verify stream Lambda package
          STREAM_PACKAGE="./iac/terraform/stream_lambda.zip"
          if [ ! -f "$STREAM_PACKAGE" ]; then
            echo "Error: Stream Lambda package not found at: $STREAM_PACKAGE"
            exit 1
          fi
          echo "✓ Stream Lambda package verified at: $STREAM_PACKAGE"
          ls -lh "$STREAM_PACKAGE"
      - name: Terraform Init
        working-directory: iac/terraform
        run: terraform init
      - name: Terraform Plan
        id: terraform-plan
        working-directory: iac/terraform
        run: terraform plan -out=tfplan
        continue-on-error: true
      - name: Terraform Apply
        working-directory: iac/terraform
        run: |
          if [ "${{ steps.terraform-plan.outcome }}" == "success" ]; then
            terraform apply tfplan
          else
            terraform apply -auto-approve
          fi

permissions:
  id-token: write
  contents: read