name: Python Deploy to prod

on:
  workflow_run:
    workflows: ["Python Deploy to test"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: prod
    concurrency: deploy-python-${{ github.ref }}-${{ github.workflow }}-${{ github.environment }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      
      - name: Download Lambda deployment package
        uses: actions/download-artifact@v4
        with:
          name: lambda-deployment-package
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      
      - name: Deploy Lambda function
        run: |
          echo "Deploying Python Lambda to production environment"
          aws lambda update-function-code \
            --function-name "${{ vars.PROJECT_NAME }}-file-processor" \
            --zip-file fileb://lambda-s3-lambda-trigger.zip \
            --environment Variables="{ENVIRONMENT=prod}"
      
      - name: Run smoke tests
        run: |
          echo "Running production smoke tests"
          # Add production verification tests here
      
      - name: Notify deployment success
        run: |
          echo "Production deployment completed successfully"