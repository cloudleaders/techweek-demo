name: Destroy AWS Resources

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "DESTROY" to confirm resource destruction'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm_destroy == 'DESTROY'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        aws-region: ${{ vars.AWS_REGION }}
    
    - name: Destroy AWS-14 Resources (S3-Lambda)
      run: |
        echo "🗑️ Destroying AWS-14 resources..."
        
        # Remove S3 bucket notification first
        aws s3api put-bucket-notification-configuration --bucket techweek-demo-dev-upload-bucket --notification-configuration '{}' || true
        
        # Delete Lambda permission
        aws lambda remove-permission --function-name techweek-demo-dev-s3-processor --statement-id AllowExecutionFromS3Bucket || true
        
        # Delete Lambda function
        aws lambda delete-function --function-name techweek-demo-dev-s3-processor || true
        
        # Empty and delete S3 bucket
        aws s3 rm s3://techweek-demo-dev-upload-bucket --recursive || true
        aws s3api delete-bucket --bucket techweek-demo-dev-upload-bucket || true
        
        # Delete CloudWatch log group
        aws logs delete-log-group --log-group-name /aws/lambda/techweek-demo-dev-s3-processor || true
        
        # Delete IAM role policy
        aws iam delete-role-policy --role-name techweek-demo-dev-lambda-role --policy-name techweek-demo-dev-s3-lambda-policy || true
        
        # Delete IAM role
        aws iam delete-role --role-name techweek-demo-dev-lambda-role || true
        
        echo "✅ AWS-14 resources destroyed"
    
    - name: Destroy AWS-16 Resources (DynamoDB-SQS-Lambda)
      run: |
        echo "🗑️ Destroying AWS-16 resources..."
        
        # Delete Lambda event source mappings
        aws lambda list-event-source-mappings --function-name techweek-demo-processor --query 'EventSourceMappings[].UUID' --output text | xargs -I {} aws lambda delete-event-source-mapping --uuid {} || true
        aws lambda list-event-source-mappings --function-name techweek-demo-stream-processor --query 'EventSourceMappings[].UUID' --output text | xargs -I {} aws lambda delete-event-source-mapping --uuid {} || true
        
        # Delete Lambda functions
        aws lambda delete-function --function-name techweek-demo-processor || true
        aws lambda delete-function --function-name techweek-demo-stream-processor || true
        
        # Delete SQS queues
        aws sqs delete-queue --queue-url $(aws sqs get-queue-url --queue-name techweek-demo-dynamodb-changes --query 'QueueUrl' --output text) || true
        aws sqs delete-queue --queue-url $(aws sqs get-queue-url --queue-name techweek-demo-dynamodb-changes-dlq --query 'QueueUrl' --output text) || true
        
        # Delete DynamoDB table
        aws dynamodb delete-table --table-name techweek-demo-users || true
        
        # Delete IAM roles and policies
        aws iam delete-role-policy --role-name techweek-demo-lambda-role --policy-name techweek-demo-lambda-policy || true
        aws iam delete-role-policy --role-name techweek-demo-stream-lambda-role --policy-name techweek-demo-stream-lambda-policy || true
        aws iam delete-role --role-name techweek-demo-lambda-role || true
        aws iam delete-role --role-name techweek-demo-stream-lambda-role || true
        
        echo "✅ AWS-16 resources destroyed"
      
    - name: Confirm Complete Destruction
      run: |
        echo "🎉 All AWS-14 and AWS-16 resources have been destroyed!"
        echo "💰 AWS charges should stop within minutes"
        echo "🔍 Verify in AWS Console that all resources are gone"
    
    - name: Force Delete Remaining Resources
      run: |
        echo "🔧 Force deleting any remaining resources..."
        
        # Force delete specific Lambda function
        aws lambda delete-function --function-name techweek-demo-dev-s3-processor || true
        
        # Force delete S3 bucket with versioning disabled first
        aws s3api put-bucket-versioning --bucket techweek-demo-dev-upload-bucket --versioning-configuration Status=Suspended || true
        aws s3api delete-bucket-policy --bucket techweek-demo-dev-upload-bucket || true
        aws s3 rm s3://techweek-demo-dev-upload-bucket --recursive --include "*" || true
        aws s3api list-object-versions --bucket techweek-demo-dev-upload-bucket --query 'Versions[].{Key:Key,VersionId:VersionId}' --output text | while read key version; do aws s3api delete-object --bucket techweek-demo-dev-upload-bucket --key "$key" --version-id "$version" || true; done
        aws s3api list-object-versions --bucket techweek-demo-dev-upload-bucket --query 'DeleteMarkers[].{Key:Key,VersionId:VersionId}' --output text | while read key version; do aws s3api delete-object --bucket techweek-demo-dev-upload-bucket --key "$key" --version-id "$version" || true; done
        aws s3api delete-bucket --bucket techweek-demo-dev-upload-bucket || true
        
        # Force delete SQS queue
        SQS_URL=$(aws sqs get-queue-url --queue-name techweek-demo-dynamodb-changes --query 'QueueUrl' --output text 2>/dev/null || echo "")
        if [ ! -z "$SQS_URL" ]; then
          aws sqs delete-queue --queue-url "$SQS_URL" || true
        fi
        
        # Force delete DynamoDB table
        aws dynamodb delete-table --table-name techweek-demo-users || true
        
        # Wait for DynamoDB table deletion
        echo "⏳ Waiting for DynamoDB table deletion..."
        aws dynamodb wait table-not-exists --table-name techweek-demo-users || true
        
        # Force delete all associated IAM roles and policies
        echo "🗑️ Force deleting IAM roles and policies..."
        
        # Delete policies from roles first
        aws iam delete-role-policy --role-name techweek-demo-dev-lambda-role --policy-name techweek-demo-dev-s3-lambda-policy || true
        aws iam delete-role-policy --role-name techweek-demo-lambda-role --policy-name techweek-demo-lambda-policy || true
        aws iam delete-role-policy --role-name techweek-demo-stream-lambda-role --policy-name techweek-demo-stream-lambda-policy || true
        
        # Delete the roles
        aws iam delete-role --role-name techweek-demo-dev-lambda-role || true
        aws iam delete-role --role-name techweek-demo-lambda-role || true
        aws iam delete-role --role-name techweek-demo-stream-lambda-role || true
        
        # Verify deletion
        echo "🔍 Verifying deletion..."
        aws lambda get-function --function-name techweek-demo-dev-s3-processor && echo "❌ Lambda still exists" || echo "✅ Lambda deleted"
        aws s3api head-bucket --bucket techweek-demo-dev-upload-bucket && echo "❌ S3 bucket still exists" || echo "✅ S3 bucket deleted"
        aws sqs get-queue-url --queue-name techweek-demo-dynamodb-changes && echo "❌ SQS queue still exists" || echo "✅ SQS queue deleted"
        aws dynamodb describe-table --table-name techweek-demo-users && echo "❌ DynamoDB table still exists" || echo "✅ DynamoDB table deleted"
        
        echo "🏁 Force cleanup completed"