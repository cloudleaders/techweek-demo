name: Destroy AWS Resources

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "DESTROY" to confirm resource destruction'
        required: true
        type: string

jobs:
  destroy:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm_destroy == 'DESTROY'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ~1.6
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        aws-region: ${{ vars.AWS_REGION }}
    
    - name: Terraform Init
      working-directory: iac/terraform
      run: terraform init
    
    - name: Import existing resources
      working-directory: iac/terraform
      run: |
        # Import AWS-14 resources (adjust names as needed)
        terraform import aws_s3_bucket.upload_bucket techweek-demo-dev-upload-bucket || true
        terraform import aws_lambda_function.s3_processor techweek-demo-dev-s3-processor || true
        terraform import aws_iam_role.lambda_execution_role techweek-demo-dev-lambda-role || true
        terraform import aws_cloudwatch_log_group.lambda_logs /aws/lambda/techweek-demo-dev-s3-processor || true
        
        # Import AWS-16 resources (adjust names as needed)
        terraform import aws_dynamodb_table.users techweek-demo-users || true
        terraform import aws_sqs_queue.dynamodb_changes techweek-demo-dynamodb-changes || true
        terraform import aws_sqs_queue.dynamodb_changes_dlq techweek-demo-dynamodb-changes-dlq || true
        terraform import aws_lambda_function.processor techweek-demo-processor || true
        terraform import aws_lambda_function.stream_processor techweek-demo-stream-processor || true
        
        echo "Import completed (errors ignored)"
    
    - name: Terraform Destroy
      working-directory: iac/terraform
      run: terraform destroy -auto-approve
      
    - name: Confirm Destruction
      run: echo "✅ All AWS-14 and AWS-16 resources destroyed"